name: projet_b2_flutter
description: Application d'achat/vente entre particuliers - Bloc 2
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  http: ^1.2.1

  # État
  provider: ^6.1.2

  # Navigation
  go_router: ^14.1.4

  # Supabase
  supabase_flutter: ^2.5.0

  # Local storage
  shared_preferences: ^2.2.3

  # Form validation
  form_validator: ^2.1.1

  # Images
  image_picker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
